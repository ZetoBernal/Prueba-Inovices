name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (.NET) - build y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore back/GlobalInvoice.slnx

      - name: Build de producción (Release)
        run: dotnet build back/GlobalInvoice.slnx --no-restore --configuration Release

      - name: Ejecutar pruebas unitarias
        run: dotnet test back/GlobalInvoice.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Angular) - build y pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front/front-global-invoice

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: front/front-global-invoice/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npx ng test --watch=false

      - name: Build de producción
        run: npx ng build --configuration production
