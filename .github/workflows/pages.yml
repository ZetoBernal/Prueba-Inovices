name: Publicar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front/front-global-invoice
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/front-global-invoice/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # base-href debe coincidir con el nombre del repositorio, porque el sitio
      # se publica en https://<usuario>.github.io/<repositorio>/
      - name: Build de producción
        run: npx ng build --configuration production --base-href /Prueba-Inovices/

      # GitHub Pages sirve archivos estáticos: sin este 404.html, recargar una
      # ruta interna de Angular (por ejemplo /login) devolvería un 404 real.
      - name: Copia de respaldo para el enrutado del SPA
        run: cp dist/front-global-invoice/browser/index.html dist/front-global-invoice/browser/404.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: front/front-global-invoice/dist/front-global-invoice/browser

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
